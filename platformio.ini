; Demo de capacidades del ESP32 sin hardware externo.
; Requiere el Arduino core 3.x, que se obtiene con la plataforma pioarduino.

[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = direct
monitor_rts = 0
monitor_dtr = 0
; Wi-Fi + BLE no caben en la partición por defecto (1.2 MB)
board_build.partitions = huge_app.csv
