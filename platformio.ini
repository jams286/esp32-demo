; Demo de capacidades del ESP32 sin hardware externo.
; Requiere el Arduino core 3.x, que se obtiene con la plataforma pioarduino.

[platformio]
default_envs = esp32dev
; Contraseña de OTA (ver secrets.ini.example)
extra_configs = secrets.ini

[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = direct
monitor_rts = 0
monitor_dtr = 0
; Wi-Fi + BLE + OTA: dos ranuras de aplicación de 1.94 MB (ota_0 y ota_1), con NVS en el mismo
; offset que huge_app.csv para conservar las credenciales Wi-Fi guardadas
board_build.partitions = partitions.csv
lib_deps = h2zero/NimBLE-Arduino@^2
build_flags = -DOTA_PASSWORD=\"${secrets.ota_password}\"

; Actualización por Wi-Fi desde el PC (espota). Para usar la IP en vez del nombre:
;   pio run -e esp32dev-ota -t upload --upload-port 192.168.1.50
[env:esp32dev-ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = esp32-demo.local
upload_flags = --auth=${secrets.ota_password}

; Imagen defectuosa a propósito: se cae a los ~5 s de arrancar, antes de validarse,
; para comprobar que el rollback automático vuelve a la versión anterior.
[env:esp32dev-ota-faulty]
extends = env:esp32dev-ota
build_flags =
  ${env:esp32dev.build_flags}
  -DOTA_SIMULATE_FAILURE
